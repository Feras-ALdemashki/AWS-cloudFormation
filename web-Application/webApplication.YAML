AWSTemplateFormatVersion: "2010-09-09"
Description: "Web server with ALB, ASG, Route 53, CloudWatch Logs, SNS, and CPU alarm"

Parameters:
  InstanceType:
    Description: "Enter t2.micro or t3.micro. Default is t2.micro."
    Type: String
    Default: "t2.micro"
    AllowedValues:
      - "t2.micro"
      - "t3.micro"

  SNSEmailEndpoint:
    Description: "Email address that will receive SNS notifications"
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: "Must be a valid email address."

  CPUAlarmThreshold:
    Description: "CPU percentage that will trigger the alarm"
    Type: Number
    Default: 70

Resources:
  WebServerEC2LaunchTemplate:
    Type: "AWS::EC2::LaunchTemplate"
    Properties:
      LaunchTemplateName: "WebServerTemplate"
      LaunchTemplateData:
        ImageId: "ami-00e801948462f718a"
        InstanceType: !Ref InstanceType
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups:
              - !Ref WebServerEC2SecurityGroup
        UserData:
          Fn::Base64: |
            #!/bin/bash
            set -xe

            yum update -y
            yum install -y httpd

            systemctl start httpd
            systemctl enable httpd

            TOKEN=$(curl -sS -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
            PUBLIC_IP=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/public-ipv4)
            INSTANCE_ID=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)

            echo "<h1>Hello from EC2</h1>" > /var/www/html/index.html
            echo "<h2>Instance ID: $INSTANCE_ID</h2>" >> /var/www/html/index.html
            echo "<h2>Public IPv4: $PUBLIC_IP</h2>" >> /var/www/html/index.html

  WebServerASG:
    Type: "AWS::AutoScaling::AutoScalingGroup"
    Properties:
      AutoScalingGroupName: "WebServerASG-Demo"
      LaunchTemplate:
        LaunchTemplateId: !Ref WebServerEC2LaunchTemplate
        Version: !GetAtt WebServerEC2LaunchTemplate.LatestVersionNumber
      DesiredCapacity: "2"
      MaxSize: "2"
      MinSize: "1"
      VPCZoneIdentifier:
        - "subnet-09856c9b0e1b0e0b8"
        - "subnet-0baa48aaba98c873f"
      TargetGroupARNs:
        - !Ref webServerALBTargetGroup

  webServerALB:
    Type: "AWS::ElasticLoadBalancingV2::LoadBalancer"
    Properties:
      IpAddressType: "ipv4"
      Name: "webServerLoadBalancer"
      SecurityGroups:
        - !Ref WebServerALBSecurityGroup
      Subnets:
        - "subnet-09856c9b0e1b0e0b8"
        - "subnet-0baa48aaba98c873f"
      Type: "application"

  webServerALBListener:
    Type: "AWS::ElasticLoadBalancingV2::Listener"
    Properties:
      DefaultActions:
        - Type: "forward"
          TargetGroupArn: !Ref webServerALBTargetGroup
      LoadBalancerArn: !Ref webServerALB
      Port: 80
      Protocol: "HTTP"

  webServerALBTargetGroup:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      Name: "webServerTargetGroup"
      Port: 80
      Protocol: "HTTP"
      TargetType: "instance"
      VpcId: "vpc-05698cf708991f944"
      HealthCheckPath: "/"
      HealthCheckProtocol: "HTTP"
      Matcher:
        HttpCode: "200"

  WebServerALBSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Allow HTTP from internet to ALB"
      VpcId: "vpc-05698cf708991f944"
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"

  WebServerEC2SecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Allow HTTP from ALB to EC2"
      VpcId: "vpc-05698cf708991f944"
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref WebServerALBSecurityGroup

  webServerCloudWatchLogs:
    Type: "AWS::Logs::LogGroup"
    Properties:
      LogGroupName: "/aws/route53/webServerDemo.com"
      RetentionInDays: 3

  WebServerRoute53LogsPolicy:
    Type: "AWS::Logs::ResourcePolicy"
    Properties:
      PolicyName: "WebServerRoute53LogsPolicy"
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "Route53LogsToCloudWatchLogs",
              "Effect": "Allow",
              "Principal": {
                "Service": "route53.amazonaws.com"
              },
              "Action": [
                "logs:CreateLogStream",
                "logs:PutLogEvents"
              ],
              "Resource": "arn:aws:logs:us-east-1:${AWS::AccountId}:log-group:/aws/route53/*"
            }
          ]
        }

  webServerRoute53HostedZone:
    Type: "AWS::Route53::HostedZone"
    DependsOn: WebServerRoute53LogsPolicy
    Properties:
      Name: "webServerDemo.com"
      QueryLoggingConfig:
        CloudWatchLogsLogGroupArn: !GetAtt webServerCloudWatchLogs.Arn

  WebServerDNSRecord:
    Type: "AWS::Route53::RecordSet"
    Properties:
      HostedZoneId: !Ref webServerRoute53HostedZone
      Name: "www.webServerDemo.com."
      Type: "A"
      AliasTarget:
        DNSName: !GetAtt webServerALB.DNSName
        HostedZoneId: !GetAtt webServerALB.CanonicalHostedZoneID

  webServerSNSTopic:
    Type: "AWS::SNS::Topic"
    Properties:
      TopicName: "web-server-alerts"

  webServerSNSSub:
    Type: "AWS::SNS::Subscription"
    Properties:
      Endpoint: !Ref SNSEmailEndpoint
      Protocol: "email"
      TopicArn: !Ref webServerSNSTopic

  WebServerCPUAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName: "web-server-asg-high-cpu"
      AlarmDescription: "Alarm when average CPU usage of the Auto Scaling Group is high"
      Namespace: "AWS/EC2"
      MetricName: "CPUUtilization"
      Statistic: "Average"
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref CPUAlarmThreshold
      ComparisonOperator: "GreaterThanThreshold"
      TreatMissingData: "notBreaching"
      Dimensions:
        - Name: "AutoScalingGroupName"
          Value: !Ref WebServerASG
      AlarmActions:
        - !Ref webServerSNSTopic
      OKActions:
        - !Ref webServerSNSTopic

Outputs:
  LoadBalancerDNSName:
    Description: "DNS name of the Application Load Balancer"
    Value: !GetAtt webServerALB.DNSName

  Route53RecordName:
    Description: "Route 53 record created for the web server"
    Value: "www.webServerDemo.com"

  SNSTopicArn:
    Description: "SNS topic used for CloudWatch alarm notifications"
    Value: !Ref webServerSNSTopic
